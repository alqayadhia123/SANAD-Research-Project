[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanad-driver-wallet-poc"
version = "0.2.0"
description = "Research proof of concept for driver identity protection using Keycloak and OIDC"
requires-python = ">=3.10"
dependencies = [
  "Flask==3.1.2",
  "gunicorn==23.0.0",
  "redis==5.2.1",
  "celery==5.4.0",
  "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests", "transport_poc/core", "transport_poc/driver_wallet_api/tests"]
pythonpath = [".", "transport_poc/driver_wallet_api"]
addopts = "-ra"
markers = ["integration: requires external service containers"]

[tool.setuptools]
py-modules = []
