services:
  - type: web
    name: sanad-driver-wallet-poc
    env: docker
    plan: free
    dockerfilePath: ./transport_poc/driver_wallet_api/Dockerfile
    dockerContext: .
    envVars:
      # Set a reachable HTTPS Keycloak issuer in the Render dashboard.
      # Compose-only hostnames are not reachable from Render.
      - key: KEYCLOAK_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        value: driver-wallet-api
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: EXPECTED_AUDIENCE
        value: driver-wallet-api
      - key: HTTP_TIMEOUT_SECONDS
        value: "3"
      - key: PORT
        value: "10000"
