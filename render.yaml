# SANAD Render Blueprint — research deployment only.
# Review Render's paid service/database pricing before applying this blueprint.
# Secrets are generated by Render and must never be copied into GitHub.

envVarGroups:
  - name: sanad-oidc-shared
    envVars:
      - key: OIDC_CLIENT_SECRET
        generateValue: true
      - key: KEYCLOAK_ADMIN_USERNAME
        value: sanad-admin

databases:
  - name: sanad-keycloak-db
    databaseName: sanad_keycloak
    user: sanad_keycloak
    plan: basic-256mb
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: sanad-keycloak
    runtime: docker
    plan: starter
    region: frankfurt
    rootDir: transport_poc/keycloak
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - fromGroup: sanad-oidc-shared
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL
        fromDatabase:
          name: sanad-keycloak-db
          property: connectionString
      - key: KC_DB_USERNAME
        fromDatabase:
          name: sanad-keycloak-db
          property: user
      - key: KC_DB_PASSWORD
        fromDatabase:
          name: sanad-keycloak-db
          property: password
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HOSTNAME_STRICT
        value: "true"
      - key: KC_HEALTH_ENABLED
        value: "true"
      - key: KC_METRICS_ENABLED
        value: "true"
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: KC_HOSTNAME
        value: https://sanad-keycloak.onrender.com

  - type: web
    name: sanad-demo
    runtime: docker
    plan: starter
    region: frankfurt
    rootDir: transport_poc/driver_wallet_api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: sanad-oidc-shared
      - key: KEYCLOAK_ISSUER
        value: https://sanad-keycloak.onrender.com/realms/sanad-lab
      - key: INTROSPECTION_URL
        value: http://sanad-keycloak:8080/realms/sanad-lab/protocol/openid-connect/token/introspect
      - key: OIDC_CLIENT_ID
        value: driver-wallet-api
      - key: EXPECTED_AUDIENCE
        value: driver-wallet-api
      - key: REQUIRED_WALLET_SCOPE
        value: wallet:read
      - key: HTTP_TIMEOUT_SECONDS
        value: "5"
