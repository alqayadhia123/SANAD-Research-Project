services:
  - type: web
    name: sanad-demo
    env: docker
    plan: free
    dockerfilePath: ./transport_poc/driver_wallet_api/Dockerfile
    dockerContext: ./transport_poc/driver_wallet_api
    envVars:
      # Set this to the externally reachable HTTPS issuer for your Keycloak realm in Render.
      - key: KEYCLOAK_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        value: driver-wallet-api
      - key: EXPECTED_AUDIENCE
        value: driver-wallet-api
      - key: REQUIRED_WALLET_SCOPE
        value: wallet:read
      # Set OIDC_CLIENT_SECRET in the Render dashboard; never commit it.
