name: SANAD authentication tests

on:
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "transport_poc/driver_wallet_api/**"
      - ".github/workflows/sanad-auth-tests.yml"
  pull_request:
    paths:
      - "transport_poc/driver_wallet_api/**"
      - ".github/workflows/sanad-auth-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transport_poc/driver_wallet_api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: transport_poc/driver_wallet_api/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run authentication regression tests
        env:
          DEMO_MODE: "true"
        run: python -m unittest discover -s tests -v
