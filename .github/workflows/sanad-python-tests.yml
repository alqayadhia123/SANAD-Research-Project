name: SANAD Python tests

on:
  pull_request:
    branches: [main]
    paths:
      - "transport_poc/driver_wallet_api/**"
      - "transport_poc/test_data/**"
      - "transport_poc/scripts/**"
      - "docs/TEST_DATA_GOVERNANCE.md"
      - ".github/workflows/sanad-python-tests.yml"
  push:
    branches:
      - "fix/sanad-p0-security-baseline"
      - "feature/admin-token-data-management"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: transport_poc/driver_wallet_api/requirements-dev.txt
      - name: Install Flask and test dependencies
        run: python -m pip install -r transport_poc/driver_wallet_api/requirements-dev.txt
      - name: Compile Python sources
        run: |
          python -m py_compile transport_poc/driver_wallet_api/app.py
          python -m py_compile transport_poc/driver_wallet_api/admin_data.py
          python -m py_compile transport_poc/driver_wallet_api/tests/test_admin_data.py
          python -m py_compile transport_poc/driver_wallet_api/tests/conftest.py
          python -m py_compile transport_poc/driver_wallet_api/tests/test_app.py
      - name: Validate synthetic test data
        run: python transport_poc/scripts/validate_test_data.py
      - name: Run automated tests
        run: python -m pytest -q transport_poc/driver_wallet_api/tests
